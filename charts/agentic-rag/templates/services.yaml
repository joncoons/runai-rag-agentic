{{- if .Values.application.enabled }}
{{- range $role,$port := dict "api" 8080 "query-mcp" 8011 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
  labels:
    {{- include "rag.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/component: {{ $role }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: {{ $port }}
{{- end }}
{{- end }}
