runai:
  projectName: REPLACE_PROJECT_NAME
  projectId: ''
  schedulerName: runai-scheduler
  gpuRuntimeClassName: nvidia
application:
  enabled: true
  image: REPLACE_APPLICATION_IMAGE_AT_SHA256
  roles:
  - api
  - relay
  - admission
  - writer
  - foreground
  - caption
  - query-mcp
  - refresh
  - caption-admission
  - page-extraction
  - image-extraction
  - binary-extraction
  - page-admission
  - asset-admission
  - asset-download
  replicas: 1
  resources: {}
  nodeSelector: {}
imagePullSecrets: []
secrets:
  runtime: rag-runtime
  admin: rag-local-admin
  elasticsearchCA: rag-es-ca
storage:
  artifacts:
    claim: rag-artifacts
    create: false
    size: 100Gi
    accessModes:
    - ReadWriteMany
    storageClass: ''
  source:
    claim: rag-sources
    create: false
    size: 100Gi
    accessModes:
    - ReadWriteMany
    storageClass: ''
  checkpoint:
    claim: rag-embedding-checkpoint
    create: false
    size: 20Gi
    accessModes:
    - ReadOnlyMany
    storageClass: ''
    subPath: ''
  configuration:
    claim: rag-config
    create: false
    size: 2Gi
    accessModes:
    - ReadWriteMany
    storageClass: ''
configuration:
  allowedSourceRoots: {}
  prepareTokenizers: false
  maxRequestCharacters: 65536
migrations:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 900
models:
  caption:
    enabled: false
    gpuFraction: 0.25
    checkpointClaim: REPLACE_MODEL_CHECKPOINT_PVC
    cacheClaim: REPLACE_MODEL_CACHE_PVC
    cacheSubPath: REPLACE_GPU_CACHE_SUBPATH
    profile: REPLACE_GPU_COMPATIBLE_PROFILE
    gemmBackend: REPLACE_GPU_COMPATIBLE_BACKEND
    nodeSelector: &id001 {}
    resources: &id002
      requests:
        cpu: '1'
        memory: 8Gi
    image: ''
    extraEnv: &id003 []
