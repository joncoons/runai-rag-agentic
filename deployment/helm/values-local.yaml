  OCR_ENDPOINT: http://rag-model-ocr:8000/v1/ocr
  PARSE_ENDPOINT: http://rag-model-parse:8000/v1/parse
  CAPTION_ENDPOINT: http://rag-model-caption:8000/v1/chat/completions
